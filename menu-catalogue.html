               body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: #fff;
            color: #222;
            margin: 0;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px 0 24px;
            background: #fff;
        }
        .header-left, .header-center, .header-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-left {
            justify-content: flex-start;
        }
        .header-right {
            justify-content: flex-end;
        }
        .logo {
            height: 36px;
            width: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .close-icon, .search-icon {
            font-size: 1.3rem;
            cursor: pointer;
        }
        .search-label {
            font-size: 1rem;
            margin-right: 6px;
            letter-spacing: 1px;
        }
        .catalogue-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 10px 0 18px 0;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 4px;
        }
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .category-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: #222;
            border-radius: 4px;
            margin-bottom: 10px;
            display: block;
            max-width: 100%;
            min-width: 100%;
            object-fit: cover;
            object-position: 0 1%;
        }
        .category-label {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .socials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 32px;
            margin: 36px 0 0 0;
        }
        .socials a {
            color: #222;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 1px;
        }
        footer {
            background: #222;
            color: #fff;
            padding: 24px 0 8px 0;
            font-size: 0.95rem;
            margin-top: 32px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        .footer-content {
            text-align: center;
            font-size: 0.95rem;
        
        }
        .socials{
            margin-bottom: 130px;
        }
        *{
            margin: 0;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        #contenair{

}
